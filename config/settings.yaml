database:
  path: "data/ti_aggregator.db"

scoring:
  threshold_medium: 3.0
  threshold_high: 6.0
  overlap_bonus_two_sources: 1.5
  overlap_bonus_three_plus: 3.0

retention:
  enabled: true
  retention_days: 30
  decay_scores: true
  archive_expired: true

webhooks:
  enabled: false
  service_type: "generic" # "slack", "teams", "generic"
  url: ""
  min_severity: "HIGH"
  min_sources: 2

api:
  host: "127.0.0.1"
  port: 8000
  api_key: "" # Leave empty for open development mode; set secret key for production role protection

heuristics:
  enabled: true
  dga_detection: true
  subnet_clustering: true
  dga_score_boost: 1.5
  subnet_cluster_boost: 1.0

exports:
  firewall_ips: "exports/blocklist_firewall.txt"
  dns_domains: "exports/blocklist_dns.txt"
  proxy_urls: "exports/blocklist_proxy.txt"
  edr_hashes: "exports/blocklist_edr.csv"
  all_json: "exports/threat_intel_full.json"
  stix_bundle: "exports/threat_intel_stix2.json"
  summary_report: "exports/threat_report.md"
  min_severity_for_firewall: "HIGH"
  min_severity_for_dns: "HIGH"
  min_severity_for_proxy: "MEDIUM"
  min_severity_for_edr: "MEDIUM"

enrichment:
  cache_ttl_ip_days: 3
  cache_ttl_domain_days: 7
  cache_ttl_hash_days: 30
